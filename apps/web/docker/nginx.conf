server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /admin/v1/ {
        proxy_pass http://english-room-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Ops-Admin-Token "${OPS_ADMIN_TOKEN}";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
